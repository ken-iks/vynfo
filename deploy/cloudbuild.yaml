steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/vinfoinc/cloud-run-source-deploy/vynfo/chichi:$COMMIT_SHA
      - .
    dir: chichi

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/vinfoinc/cloud-run-source-deploy/vynfo/chichi:$COMMIT_SHA

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/vinfoinc/cloud-run-source-deploy/vynfo/mensah:$COMMIT_SHA
      - .
    dir: mensah

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/vinfoinc/cloud-run-source-deploy/vynfo/mensah:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        sed \
          -e "s|CHICHI_IMAGE|us-central1-docker.pkg.dev/vinfoinc/cloud-run-source-deploy/vynfo/chichi:$COMMIT_SHA|g" \
          -e "s|MENSAH_IMAGE|us-central1-docker.pkg.dev/vinfoinc/cloud-run-source-deploy/vynfo/mensah:$COMMIT_SHA|g" \
          -e "s|DEPLOY_NONCE|$BUILD_ID|g" \
          deploy/cloud-run/chichi-service.yaml > /workspace/chichi-service.yaml
        gcloud run services replace /workspace/chichi-service.yaml --region us-central1

images:
  - us-central1-docker.pkg.dev/vinfoinc/cloud-run-source-deploy/vynfo/chichi:$COMMIT_SHA
  - us-central1-docker.pkg.dev/vinfoinc/cloud-run-source-deploy/vynfo/mensah:$COMMIT_SHA
