# For details on buf.yaml configuration, visit https://buf.build/docs/configuration/v2/buf-yaml
version: v2
modules:
  - path: .
    excludes:
      - .pnpm-store
      - node_modules
      - web/.pnpm-store
      - web/node_modules
      - agent/.venv
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
