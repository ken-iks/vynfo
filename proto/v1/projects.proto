syntax = "proto3";

package v1;

option go_package = "vynfo.com/vynfo/gen/proto/v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "proto/v1/users.proto";



// =======================  PlayBack Editor ============================= //

// MediaImage is a reference to an image asset that can either take up the full video frame,
// or be displayed at a specific pixel value depending on whether or not pos is included.
// Size clamping to the size of the video display should be handled on the client in both the
// size case and the corner position case.
message MediaImageOverlay {
    string asset_id = 1;
    MediaPosition pos = 2;
}

// MediaText is a reference to a inline text that is positioned at some place in the video frame,
// Size clamping to the size of the video display should be handled on the client in both the
// size case and the corner position case.
message MediaTextOverlay {
    MediaPosition pos = 1;
    MediaTextColor color = 2;
    string content = 3;
}

enum MediaTextColor {
    MEDIA_TEXT_COLOR_UNSPECIFIED = 0;
    MEDIA_TEXT_COLOR_BLACK = 1;
    MEDIA_TEXT_COLOR_WHITE = 2;
    MEDIA_TEXT_COLOR_CLEAR = 3;
}

message MediaPosition {
    uint64 left_corner_px = 1;
    uint64 left_corner_py = 2;
    uint64 size = 3;
}

// MediaOverlays are the types of media that can be rendered on the playback editor for an
// editing session on top of a video.
message MediaOverlay {
    oneof kind {
        MediaImageOverlay image = 1;
        MediaTextOverlay text = 2;
    }
}

// MediaVideoEffects are effects that can be layed on top of video sections
message MediaVideoEffect {
    oneof effect {
        BlurEffect blur = 1;
        SepiaEffect sepia = 2;
        SaturationEffect saturation = 3;
        BrightnessEffect brightness = 4;
    }
}

// The section video is the video that is used for this section, and start time
// represent the start time within that video that this segment should begin playing from
// NOTE: video_start_time_millies must for now be divisible by 500. This is because
// the backend currently only supports splitting a video at IFrame intervals which
// are currently set at 0.5s in our upload path. This is subject to change
message SectionVideo {
    MediaVideoMetadata meta = 1;
    uint64 video_start_time_millies = 2;
    // a video can also come with an ordered set of effects applied to the video
    repeated MediaVideoEffect effects = 3;
}

// TODO: audio sections will be a separate editing experience from the video editing
//       experience. Will support things like adding multiple differtent overlapping
//       with things like audio effects and volume levels. Save for later!
message SectionAudio {
    MediaAudioMetadata meta = 1;
    uint64 audio_start_time_millies = 2;
}

// PlaybackSection represents a particular cut of playback that is displayed between 
// these timestamps containing these assets. 
message PlaybackSection {
    uint64 start_time_millis = 1;
    uint64 end_time_millis = 2;
    SectionVideo video = 3;
    repeated MediaOverlay overlays = 5;
}

message PlaybackAudio {
    uint64 start_time_millis = 1;
    uint64 end_time_millis = 2;
    SectionAudio audio = 3;
}

message PlaybackState {
    repeated PlaybackSection video_sections = 1;
    // NOTE: audio sections will be clamped to the full length of the video sections
    repeated PlaybackAudio audio_sections = 2;
}

// NOTE: you can only not include the previous commit id when you are making the first commit
// for a branch. 
message CommitEditRequest {
    string project_id = 1;
    string branch_name = 2;
    string commit_message = 3;
    optional string previous_commit_id = 4;
    PlaybackState commit_state = 5;
}

message CommitEditResponse {
    oneof response {
        string new_commit_id = 1;
        CommitEditError err = 2;
    }
}

// AutoSave's will store the branches edited playback state in an in memory cache for
// 15 mins since the edit. We reserve the right to clear the cache after 15 mins, or
// if the pod happens to roll - so encourage users to make frequent commits
message AutoSaveRequest {
    string project_id = 1;
    string branch_id = 2;
    PlaybackState auto_save_state = 3;
}

message CommitEditError {
    oneof error_type {
        StaleBranchError stale_branch = 2;
    }
}

message StaleBranchError {
    string assumed_branch_tip_uuid = 1;
    string current_branch_tip_uuid = 2;
}

// ======================== Supported Effects =========================== //

// THese are based on FFMPeg filters

//////////////////
//
// brightness: -1.0 to 1.0, default 0
// saturation:  0.0 to 3.0, default 1
// blur:     0 to 1024, default 0.5
//
///////////////////

// Blur will apply a blur to the video section at a growing intensity scale
message BlurEffect {
    double intensity = 1;
}

// Sepia will apply a default sepria effect to the full video segment
// As a simplification, this is a grayscale + warm brown color tint
message SepiaEffect {}

message SaturationEffect {
    double strength = 1; // 0 grayscale, 1 unchanged, >1  saturated
}

message BrightnessEffect {
    double strength = 1; // >0 brighter than normal, <0 darker than normal
}

// ========================  Projects CRUD  ============================ //

// ProjectMetadata contains the core identifying information for a project
// returned in list and detail views.
message ProjectMetadata {
    string id = 1;
    string name = 2;
    string description = 3;
    google.protobuf.Timestamp created_at = 4;
    string workspace_id = 5;
    User created_by = 6;
}

// ListProjectsRequest fetches all projects belonging to a given user.
message ListProjectsRequest {
    string workspace_id = 1;
}

// ListProjectsResponse returns the projects in a workspace.
message ListProjectsResponse {
    repeated ProjectMetadata projects = 1;
}

// ListProjectAssetsRequest fetches every media asset (videos, images, audio)
// that has been uploaded or created within a project.
message ListProjectAssetsRequest {
    string project_id = 1;
}

message RemoveProjectAssetRequest {
    string project_id = 1;
    string asset_id = 2;
}

message AddProjectAssetRequest {
    string project_id = 1;
    string asset_id = 2;
}

// MediaVideoMetadata is the lightweight descriptor returned when listing video
// assets — enough for thumbnails and duration display without streaming bytes.
message MediaVideoMetadata {
    string asset_id = 1;
    string title = 2;
    double duration = 3;
    bool has_audio = 4;
}

message MediaAudioMetadata {
    string asset_id = 1;
    string title = 2;
    double duration = 3;
    // plus more configuration!
}

// MediaImageMetadata is the lightweight descriptor returned when listing image assets.
message MediaImageMetadata {
    string asset_id = 1;
    string signed_url = 2;
    string title = 3;
    string content_type = 4;
}

// ListProjectAssetsResponse groups all asset types belonging to a project so the
// client can populate the asset panel in a single round-trip.
message ListProjectAssetsResponse {
    repeated MediaVideoMetadata videos = 1;
    repeated MediaImageMetadata images = 2;
    repeated MediaAudioMetadata audios = 3;
}

// ListProjectBranchesRequest fetches every branch that belongs to a project.
message ListProjectBranchesRequest {
    string project_id = 1;
}

// BranchMetadata is the lightweight descriptor for a single branch.
message BranchMetadata {
    string name = 1;
    optional string tip_commit_id = 2;
    string id = 3;
}

// ListProjectBranchesResponse returns the branches for the requested project.
message ListProjectBranchesResponse {
    repeated BranchMetadata branches = 1;
}

message CreateProjectRequest {
    string project_name = 1;
    string project_description = 2;
    string workspace_id = 3;
}

message CreateProjectResponse {
    string created_project_id = 1;
}

message AddProjectUserRequest {
    string project_id = 1;
    string user_id = 2;
}

message DeleteProjectRequest {
    string project_id = 1;
}

message ExportProjectRequest {
    string workspace_id = 1;
    string project_id = 2;

    // export will default to latest commit unless you specify an earlier
    // commit that you would like to export
    optional string commit_id = 3;
}

message ExportProjectResponse {
    string signed_url_for_download = 1;
}

// ========================  Commits CRUD  ============================ //

message GetCommitRequest {
    string commit_id = 1;
    // state is independent of branch, but loading the state also clears
    // the edit cache for this branch which is why the extra fields are needed
    string branch_id = 2;
}

message GetCommitResponse {
    string commit_id = 1;
    string project_id = 2;
    string message = 3;
    PlaybackState commit_state = 4;
}

message ListCommitsRequest {
    string project_id = 1;
    string branch_id = 2;
}

message CommitMetadata {
    string id = 1;
    string project_id = 2;
    string user_id = 3;
    string message = 4;
    google.protobuf.Timestamp created_at = 5;
}

message ListCommitsResponse {
    repeated CommitMetadata commits = 1;
}

// ====================== Service Definition ============================== //
service ProjectService {
    rpc CommitEdit(CommitEditRequest) returns (CommitEditResponse);
    rpc GetCommit(GetCommitRequest) returns (GetCommitResponse);
    rpc ListCommits(ListCommitsRequest) returns (ListCommitsResponse);
    rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
    rpc ListProjectAssets(ListProjectAssetsRequest) returns (ListProjectAssetsResponse);
    rpc AddProjectAsset(AddProjectAssetRequest) returns (google.protobuf.Empty);
    rpc RemoveProjectAsset(RemoveProjectAssetRequest) returns (google.protobuf.Empty);
    rpc ListProjectBranches(ListProjectBranchesRequest) returns (ListProjectBranchesResponse);
    rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
    rpc AddProjectUser(AddProjectUserRequest) returns (google.protobuf.Empty);
    rpc DeleteProject(DeleteProjectRequest) returns (google.protobuf.Empty);
    rpc ExportProject(ExportProjectRequest) returns (ExportProjectResponse);
    rpc AutoSave(AutoSaveRequest) returns (google.protobuf.Empty);
}