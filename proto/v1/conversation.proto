syntax = "proto3";

package v1;

option go_package = "vynfo.com/vynfo/gen/proto/v1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "proto/v1/inter/agent_runtime/chat.proto";

service ConversationService {
    rpc CreateAIConversation(CreateAIConversationRequest) returns (CreateAIConversationResponse);
    rpc GetAIConversation(GetAIConversationRequest) returns (GetAIConversationResponse);
    rpc ListAIConversations(ListAIConversationsRequest) returns (ListAIConversationsResponse);
    rpc UpdateAIConversation(UpdateAIConversationRequest) returns (AIConversation);
    rpc DeleteAIConversation(DeleteAIConversationRequest) returns (google.protobuf.Empty);
    rpc ListAIConversationMessages(ListAIConversationMessagesRequest) returns (ListAIConversationMessagesResponse);
    rpc SendAgentMessage(SendAgentMessageRequest) returns (stream v1.inter.agent_runtime.StreamChatResponse);
    rpc GenerateNewTitle(v1.inter.agent_runtime.GenerateTitleRequest) returns (v1.inter.agent_runtime.GenerateTitleResponse);
}


message SendAgentMessageRequest {
    string content = 1;
    string workspace_id = 2;
    string conversation_id = 3;
    SendMessagePersistanceOptions persistance_options = 4;
}

message SendMessagePersistanceOptions {
    // The client-side id of the existing message this new user message replies to.
    // Chichi validates this id belongs to the conversation and stores the new user
    // message as its child.
    optional string parent_client_id = 1;

    // The client-side id assistant-ui already assigned to the user message being
    // sent. Chichi persists the matching user message row with this id so the
    // message can be referenced before and after reload.
    string client_id = 2;

    // The client-side id assistant-ui assigned to the live generated assistant
    // response. A Mensah run can contain intermediate persisted messages, but
    // this id belongs only to the final assistant message represented by the
    // streamed response in assistant-ui.
    optional string response_client_id = 3;
}

message AIConversation {
    string conversation_id = 1;
    string title = 2;
    string conversation_owner_id = 3;
    bool is_archived = 4;
    google.protobuf.Timestamp last_updated_at = 5;
}

message CreateAIConversationRequest {
    string title = 1;
    // you can optionally use a unique client id
    // for the conversation to enforce idempotency
    // on thread initialization
    optional string client_id = 2;
}

message CreateAIConversationResponse {
    AIConversation conversation = 1;
}

message GetAIConversationRequest {
    string conversation_id = 1;
}

message GetAIConversationResponse {
    AIConversation conversation = 1;
}

message ListAIConversationsRequest {
}

message ListAIConversationsResponse {
    repeated AIConversation conversations = 1;
}

message UpdateAIConversationRequest {
    string conversation_id = 1;
    string title = 2;
    bool archive_status = 3;
}

message DeleteAIConversationRequest {
    string conversation_id = 1;
}

message ListAIConversationMessagesRequest {
    string conversation_id = 1;
}

message ListAIConversationMessagesResponse {
    repeated AIConversationMessageNode messages = 1;
}

message AIConversationMessageNode {
    // Stable message id used by the frontend runtime.
    string client_id = 1;
    // Stable client id of this message's parent, if any.
    optional string parent_client_id = 2;
    v1.inter.agent_runtime.CompletedRunMessage message = 3;
}

