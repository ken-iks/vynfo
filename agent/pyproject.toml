[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.80.0",
    "protobuf>=7.35.1",
    # Use the slim package with only the OpenAI extra. The `pydantic-ai` umbrella package
    # pulls every optional provider integration, including Temporal, whose protobuf
    # constraints can force uv to backtrack to much older Pydantic AI releases.
    "pydantic-ai-slim[openai]>=1.104.0",
    "python-dotenv>=1.2.1",
    "structlog>=26.1.0",
    "tavily>=1.1.0",
]

[project.scripts]
agent = "agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "proto"]

[dependency-groups]
dev = [
    "mypy-protobuf>=5.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
